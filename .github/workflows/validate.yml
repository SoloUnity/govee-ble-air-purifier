name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Behavioral tests
        run: python -m pytest --ignore=tests/test_runtime_smoke.py

  home-assistant-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant-version: "2024.8.0"
            python-version: "3.12"
            constraints-url: >-
              https://raw.githubusercontent.com/home-assistant/core/2024.8.0/homeassistant/package_constraints.txt
            # Manifest requirements are not installed by the HA wheel, and
            # acme 2.10 is incompatible with the now-unbounded josepy 2.x.
            extra-requirements: >-
              josepy==1.14.0 bleak==0.22.2 bleak-retry-connector==3.5.0
              bluetooth-adapters==0.19.3 bluetooth-auto-recovery==1.4.2
              bluetooth-data-tools==1.19.4 dbus-fast==2.22.1
              habluetooth==3.1.3 pyserial==3.5 pyudev==0.24.1
          - homeassistant-version: "2026.5.0"
            python-version: "3.14.2"
            constraints-url: >-
              https://raw.githubusercontent.com/home-assistant/core/2026.5.0/homeassistant/package_constraints.txt
            extra-requirements: >-
              aiousbwatcher==1.1.2 serialx==1.7.0 aioesphomeapi==44.21.0
          - homeassistant-version: "2026.6.0"
            python-version: "3.14.2"
            constraints-url: >-
              https://raw.githubusercontent.com/home-assistant/core/2026.6.0/homeassistant/package_constraints.txt
            extra-requirements: >-
              aiousbwatcher==1.1.2 serialx==1.8.0 aioesphomeapi==45.3.1
          - homeassistant-version: "2026.7.2"
            python-version: "3.14.2"
            constraints-url: >-
              https://raw.githubusercontent.com/home-assistant/core/2026.7.2/homeassistant/package_constraints.txt
            extra-requirements: >-
              aiousbwatcher==1.1.2 serialx==1.8.2 aioesphomeapi==45.3.1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install Home Assistant and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --constraint "${{ matrix.constraints-url }}"
          -e ".[dev]" "homeassistant==${{ matrix.homeassistant-version }}"
          ${{ matrix.extra-requirements }}
      - name: Test against real Home Assistant APIs
        run: python -m pytest tests/test_runtime_smoke.py

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
