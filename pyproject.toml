[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "govee-ble-air-purifier-protocol"
version = "0.1.0"
description = "Reusable protocol, crypto, and model profiles for Govee H712-family BLE air purifiers"
readme = "docs/protocol-library.md"
requires-python = ">=3.12"
dependencies = ["cryptography>=43.0.0"]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Documentation = "https://github.com/SoloUnity/govee-ble-air-purifier"
Issues = "https://github.com/SoloUnity/govee-ble-air-purifier/issues"
Repository = "https://github.com/SoloUnity/govee-ble-air-purifier"

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "jsonschema==4.25.1",
    "mypy==1.18.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.21",
]

[tool.setuptools]
packages = [
    "govee_ble_air_purifier_protocol",
    "govee_ble_air_purifier_protocol.model_profiles",
    "govee_ble_air_purifier_protocol.schemas",
]
package-dir = {govee_ble_air_purifier_protocol = "custom_components/govee_ble_air_purifier/govee_ble_air_purifier_protocol"}
include-package-data = true

[tool.setuptools.package-data]
govee_ble_air_purifier_protocol = [
    "py.typed",
    "model_profiles/*.json",
    "schemas/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "runtime_ha: requires a real Home Assistant installation",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = ["B"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "skip"
files = [
    "custom_components/govee_ble_air_purifier/bluetooth/_arbiter.py",
    "custom_components/govee_ble_air_purifier/bluetooth/_connection.py",
    "custom_components/govee_ble_air_purifier/bluetooth/_night_light_polling.py",
    "custom_components/govee_ble_air_purifier/bluetooth/_notifications.py",
    "custom_components/govee_ble_air_purifier/bluetooth/_push.py",
    "custom_components/govee_ble_air_purifier/bluetooth/_session.py",
    "custom_components/govee_ble_air_purifier/bluetooth/_transactions.py",
    "custom_components/govee_ble_air_purifier/govee_ble_air_purifier_protocol",
    "custom_components/govee_ble_air_purifier/custom_auto/config.py",
    "custom_components/govee_ble_air_purifier/custom_auto/policy.py",
    "custom_components/govee_ble_air_purifier/const.py",
]

[tool.coverage.run]
branch = true
source = ["custom_components/govee_ble_air_purifier"]

[tool.coverage.report]
fail_under = 89.0
precision = 2
show_missing = true
skip_covered = true
